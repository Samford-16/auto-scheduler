<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard — A-Schedule</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <nav>
    <a href="index.html" class="nav-logo">A-Schedule</a>
    <div class="nav-links">
      <a href="dashboard.html" class="active">Dashboard</a>
      <a href="schedule.html">Schedule</a>
      <a href="setup.html">Setup</a>
      <div class="nav-company" id="nav-company">—</div>
      <button class="btn-logout" onclick="logout()">Sign Out</button>
    </div>
  </nav>

  <div class="container">
    <div style="display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:2rem;">
      <div>
        <h1>Workers</h1>
        <p class="subtitle">Manage your team's availability, roles, and hours.</p>
      </div>
      <a href="add-worker.html" class="btn btn-primary">+ Add Worker</a>
    </div>

    <div class="stats">
      <div class="stat-card"><div class="stat-label">Total Workers</div><div class="stat-value accent" id="stat-workers">—</div></div>
      <div class="stat-card"><div class="stat-label">Overtime Eligible</div><div class="stat-value" id="stat-ot">—</div></div>
      <div class="stat-card"><div class="stat-label">Max Weekly Hours</div><div class="stat-value" id="stat-hours">—</div></div>
    </div>

    <div class="card-overflow">
      <div class="card-header"><div class="card-title">Team Roster</div></div>
      <div id="workers-container">
        <div class="empty-state">
          <div class="icon">👥</div>
          <p>No workers added yet.</p>
          <a href="add-worker.html" class="btn btn-primary">Add your first worker</a>
        </div>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script src="js/auth.js"></script>
  <script>
    if (!getToken()) window.location.href = "login.html";

    function showToast(msg, type = "success") {
      const t = document.getElementById("toast");
      t.textContent = msg; t.className = `toast ${type} show`;
      setTimeout(() => t.className = "toast", 3000);
    }

    function loadWorkers() {
      fetch(`${API}/workers`, { headers: authHeaders() }).then(r => r.json()).then(data => {
        const workers = data.workers || [];
        document.getElementById("stat-workers").textContent = workers.length;
        document.getElementById("stat-ot").textContent = workers.filter(w => w.overtime === "yes").length;
        document.getElementById("stat-hours").textContent = workers.reduce((s, w) => s + w.max_hours, 0);
        if (!workers.length) return;
        const tbody = workers.map(w => `
          <tr>
            <td><strong>${w.name}</strong></td>
            <td>${w.max_hours} hrs/wk</td>
            <td><span class="badge ${w.overtime === 'yes' ? 'badge-yes' : 'badge-no'}">${w.overtime === 'yes' ? 'Yes' : 'No'}</span></td>
            <td>${w.roles.length ? w.roles.map(r => `<span class="role-chip">${r.name}</span>`).join("") : '<span style="color:var(--muted)">—</span>'}</td>
            <td>${w.availability.length ? w.availability.map(d => `<span class="days-chip">${d}</span>`).join("") : '<span style="color:var(--muted)">—</span>'}</td>
            <td><button class="btn btn-danger" onclick="deleteWorker(${w.id}, '${w.name}')">Delete</button></td>
          </tr>`).join("");
        document.getElementById("workers-container").innerHTML = `
          <table><thead><tr><th>Name</th><th>Max Hours</th><th>Overtime</th><th>Roles</th><th>Availability</th><th>Action</th></tr></thead>
          <tbody>${tbody}</tbody></table>`;
      });
    }

    function deleteWorker(id, name) {
      if (!confirm(`Remove ${name}?`)) return;
      fetch(`${API}/delete-worker/${id}`, { method: "DELETE", headers: authHeaders() })
        .then(() => { showToast(`${name} removed`); loadWorkers(); });
    }

    loadWorkers();
  </script>
</body>
</html>
