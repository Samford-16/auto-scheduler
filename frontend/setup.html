<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Setup — A-Schedule</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app-layout">
    <aside class="sidebar">
      <a href="index.html" class="sidebar-logo">A-Schedule</a>
      <nav class="sidebar-nav">
        <span class="sidebar-section">Workspace</span>
        <a href="dashboard.html" class="nav-item" data-page="dashboard"><span class="icon">👥</span> Workers</a>
        <a href="schedule.html" class="nav-item" data-page="schedule"><span class="icon">📅</span> Schedule</a>
        <span class="sidebar-section">Account</span>
        <a href="setup.html" class="nav-item active" data-page="setup"><span class="icon">⚙️</span> Setup</a>
        <a href="settings.html" class="nav-item" data-page="settings"><span class="icon">🎨</span> Settings</a>
      </nav>
      <div class="sidebar-bottom">
        <div class="sidebar-company">
          <div class="sidebar-company-avatar" id="sidebar-company-initial">—</div>
          <span class="sidebar-company-name" id="sidebar-company-name">—</span>
        </div>
        <button class="nav-item" onclick="logout()" style="color:#f87171"><span class="icon">🚪</span> Sign Out</button>
      </div>
    </aside>

    <main class="main-content">
      <div class="page-header">
        <div>
          <h1>Setup</h1>
          <p class="subtitle">Configure your business details, operating hours, and roles.</p>
        </div>
      </div>

      <div style="max-width:600px">
        <div class="card">
          <div class="card-title-lg">Business Info</div>
          <div class="form-group">
            <label>Company Name</label>
            <input type="text" id="company-name" placeholder="e.g. Dunkin' — Main St">
          </div>
          <div class="form-row">
            <div class="form-group"><label>Opening Time</label><input type="time" id="open-time"></div>
            <div class="form-group"><label>Closing Time</label><input type="time" id="close-time"></div>
          </div>
          <button class="btn btn-primary" onclick="saveCompany()">Save Changes</button>
        </div>

        <div class="card">
          <div class="card-title-lg">Roles & Positions</div>
          <div class="roles-list" id="roles-list">
            <span style="color:var(--text-muted);font-size:0.85rem">No roles yet...</span>
          </div>
          <div class="add-role-row">
            <input type="text" id="role-input" placeholder="e.g. Drive-thru, Barista, Cashier..." onkeydown="if(event.key==='Enter') addRole()">
            <button class="btn btn-primary" onclick="addRole()">Add Role</button>
          </div>
        </div>
      </div>
    </main>
  </div>
  <div class="toast" id="toast"></div>
  <script src="js/auth.js"></script>
  <script>
    if (!getToken()) window.location.href = "login.html";
    initSidebar("setup");

    function showToast(msg, type = "success") {
      const t = document.getElementById("toast");
      t.textContent = msg; t.className = `toast ${type} show`;
      setTimeout(() => t.className = "toast", 3000);
    }

    document.addEventListener("DOMContentLoaded", () => {
      fetch(`${API}/me`, { headers: authHeaders() }).then(r => r.json()).then(data => {
        if (data.company) {
          document.getElementById("company-name").value = data.company.name || "";
          document.getElementById("open-time").value = data.company.open_time || "";
          document.getElementById("close-time").value = data.company.close_time || "";
        }
      });
      loadRoles();
    });

    function loadRoles() {
      fetch(`${API}/roles`, { headers: authHeaders() }).then(r => r.json()).then(data => {
        const list = document.getElementById("roles-list");
        list.innerHTML = data.roles.length
          ? data.roles.map(r => `<div class="role-tag">${r.name}<span class="del" onclick="deleteRole(${r.id})">×</span></div>`).join("")
          : `<span style="color:var(--text-muted);font-size:0.85rem">No roles yet...</span>`;
      });
    }

    function saveCompany() {
      const name = document.getElementById("company-name").value.trim();
      const open = document.getElementById("open-time").value;
      const close = document.getElementById("close-time").value;
      if (!name || !open || !close) return showToast("Please fill in all fields", "error");
      fetch(`${API}/company`, { method: "POST", headers: authHeaders(), body: JSON.stringify({ name, open_time: open, close_time: close }) })
        .then(() => {
          showToast("Saved!");
          const c = getCompany();
          localStorage.setItem("company", JSON.stringify({ ...c, name }));
          document.getElementById("sidebar-company-name").textContent = name;
          document.getElementById("sidebar-company-initial").textContent = name.charAt(0).toUpperCase();
        });
    }

    function addRole() {
      const input = document.getElementById("role-input");
      const name = input.value.trim();
      if (!name) return;
      fetch(`${API}/roles`, { method: "POST", headers: authHeaders(), body: JSON.stringify({ name }) })
        .then(r => r.json()).then(data => {
          if (data.status === "success") { input.value = ""; loadRoles(); showToast(`Role "${name}" added`); }
          else showToast("Role already exists", "error");
        });
    }

    function deleteRole(id) {
      fetch(`${API}/roles/${id}`, { method: "DELETE", headers: authHeaders() }).then(() => { loadRoles(); showToast("Role removed"); });
    }
  </script>
</body>
</html>
