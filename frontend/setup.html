<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Company Setup — A-Schedule</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0a0a0f;
      --surface: #13131a;
      --surface2: #1c1c28;
      --border: #2a2a3a;
      --accent: #6c63ff;
      --accent2: #ff6584;
      --text: #f0f0f8;
      --muted: #7a7a9a;
      --success: #4ade80;
      --danger: #f87171;
    }
    body { background: var(--bg); color: var(--text); font-family: 'DM Sans', sans-serif; min-height: 100vh; }

    nav {
      display: flex; align-items: center; justify-content: space-between;
      padding: 1.2rem 2rem; border-bottom: 1px solid var(--border);
      background: var(--surface);
    }
    .nav-logo { font-family: 'Syne', sans-serif; font-weight: 800; font-size: 1.3rem;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
      text-decoration: none;
    }
    .nav-links { display: flex; gap: 1rem; }
    .nav-links a { color: var(--muted); text-decoration: none; font-size: 0.9rem; transition: color 0.2s; }
    .nav-links a:hover { color: var(--text); }

    .container { max-width: 720px; margin: 0 auto; padding: 3rem 2rem; }

    h1 { font-family: 'Syne', sans-serif; font-size: 2rem; font-weight: 700; margin-bottom: 0.4rem; }
    .subtitle { color: var(--muted); margin-bottom: 2.5rem; font-size: 0.95rem; }

    .card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 16px; padding: 2rem; margin-bottom: 2rem;
    }
    .card-title {
      font-family: 'Syne', sans-serif; font-size: 1.1rem; font-weight: 600;
      margin-bottom: 1.5rem; display: flex; align-items: center; gap: 0.5rem;
    }
    .card-title .icon { font-size: 1.2rem; }

    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-bottom: 1rem; }
    .form-group { display: flex; flex-direction: column; gap: 0.4rem; margin-bottom: 1rem; }
    label { font-size: 0.8rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; font-weight: 500; }
    input, select {
      background: var(--surface2); border: 1px solid var(--border); color: var(--text);
      padding: 0.75rem 1rem; border-radius: 10px; font-family: 'DM Sans', sans-serif;
      font-size: 0.95rem; transition: border-color 0.2s;
    }
    input:focus, select:focus { outline: none; border-color: var(--accent); }

    .btn {
      display: inline-flex; align-items: center; gap: 0.5rem;
      padding: 0.8rem 1.8rem; border-radius: 10px; font-family: 'DM Sans', sans-serif;
      font-size: 0.9rem; font-weight: 500; cursor: pointer; border: none; transition: all 0.2s;
    }
    .btn-primary { background: linear-gradient(135deg, var(--accent), #8b7fff); color: white; box-shadow: 0 4px 16px rgba(108,99,255,0.3); }
    .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(108,99,255,0.4); }
    .btn-ghost { background: transparent; color: var(--muted); border: 1px solid var(--border); }
    .btn-ghost:hover { border-color: var(--danger); color: var(--danger); }

    .roles-list { display: flex; flex-wrap: wrap; gap: 0.6rem; margin-bottom: 1.2rem; min-height: 40px; }
    .role-tag {
      display: inline-flex; align-items: center; gap: 0.5rem;
      background: var(--surface2); border: 1px solid var(--border);
      padding: 0.4rem 0.9rem; border-radius: 100px; font-size: 0.85rem; color: var(--text);
    }
    .role-tag .del { cursor: pointer; color: var(--muted); font-size: 1rem; line-height: 1; transition: color 0.2s; }
    .role-tag .del:hover { color: var(--danger); }
    .role-tag.accent { border-color: var(--accent); color: var(--accent); }

    .add-role-row { display: flex; gap: 0.6rem; }
    .add-role-row input { flex: 1; }

    .toast {
      position: fixed; bottom: 2rem; right: 2rem; background: var(--surface2);
      border: 1px solid var(--border); border-radius: 12px; padding: 1rem 1.5rem;
      font-size: 0.9rem; transform: translateY(100px); opacity: 0;
      transition: all 0.3s ease; z-index: 100;
    }
    .toast.show { transform: translateY(0); opacity: 1; }
    .toast.success { border-color: var(--success); color: var(--success); }
    .toast.error { border-color: var(--danger); color: var(--danger); }
  </style>
</head>
<body>
  <nav>
    <a href="index.html" class="nav-logo">A-Schedule</a>
    <div class="nav-links">
      <a href="dashboard.html">Dashboard</a>
      <a href="setup.html" style="color: var(--text)">Setup</a>
    </div>
  </nav>

  <div class="container">
    <h1>Company Setup</h1>
    <p class="subtitle">Configure your business details, operating hours, and employee roles.</p>

    <!-- Company Info -->
    <div class="card">
      <div class="card-title"><span class="icon">🏢</span> Business Info</div>
      <div class="form-group">
        <label>Company Name</label>
        <input type="text" id="company-name" placeholder="e.g. Dunkin' — Main St">
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>Opening Time</label>
          <input type="time" id="open-time">
        </div>
        <div class="form-group">
          <label>Closing Time</label>
          <input type="time" id="close-time">
        </div>
      </div>
      <button class="btn btn-primary" onclick="saveCompany()">💾 Save Company Info</button>
    </div>

    <!-- Roles -->
    <div class="card">
      <div class="card-title"><span class="icon">🎭</span> Roles & Positions</div>
      <div class="roles-list" id="roles-list">
        <span style="color: var(--muted); font-size: 0.85rem;">No roles yet...</span>
      </div>
      <div class="add-role-row">
        <input type="text" id="role-input" placeholder="e.g. Drive-thru, Barista, Cashier..." onkeydown="if(event.key==='Enter') addRole()">
        <button class="btn btn-primary" onclick="addRole()">+ Add Role</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script src="js/auth.js"></script>

<script>
    const API = "http://34.28.196.192:5000";

    function showToast(msg, type = "success") {
      const t = document.getElementById("toast");
      t.textContent = msg;
      t.className = `toast ${type} show`;
      setTimeout(() => t.className = "toast", 3000);
    }

    // Load company
    document.addEventListener("DOMContentLoaded", () => {
  const token = localStorage.getItem("token");
  fetch(`${API}/me`, { headers: { "Content-Type": "application/json", "Authorization": `Bearer ${token}` } }).then(r=>r.json()).then(data => {
    if (data.company) {
      document.getElementById("company-name").value = data.company.name || "";
      document.getElementById("open-time").value = data.company.open_time || "";
      document.getElementById("close-time").value = data.company.close_time || "";
    }
  });
});



    // Load roles
    function loadRoles() {
      fetch(`${API}/roles`).then(r => r.json()).then(data => {
        const list = document.getElementById("roles-list");
        if (!data.roles.length) {
          list.innerHTML = `<span style="color: var(--muted); font-size: 0.85rem;">No roles yet...</span>`;
          return;
        }
        list.innerHTML = data.roles.map(r => `
          <div class="role-tag accent">
            ${r.name}
            <span class="del" onclick="deleteRole(${r.id})">×</span>
          </div>
        `).join("");
      });
    }
    loadRoles();

    function saveCompany() {
      const name = document.getElementById("company-name").value.trim();
      const open = document.getElementById("open-time").value;
      const close = document.getElementById("close-time").value;
      if (!name || !open || !close) return showToast("Please fill in all fields", "error");
      fetch(`${API}/company`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ name, open_time: open, close_time: close })
      }).then(() => showToast("✅ Company info saved!"));
    }

    function addRole() {
      const input = document.getElementById("role-input");
      const name = input.value.trim();
      if (!name) return;
      fetch(`${API}/roles`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ name })
      }).then(r => r.json()).then(data => {
        if (data.status === "success") {
          input.value = "";
          loadRoles();
          showToast(`✅ Role "${name}" added!`);
        } else {
          showToast("Role already exists", "error");
        }
      });
    }

    function deleteRole(id) {
      fetch(`${API}/roles/${id}`, { method: "DELETE" })
        .then(() => { loadRoles(); showToast("Role deleted"); });
    }
  </script>
</body>
</html>
