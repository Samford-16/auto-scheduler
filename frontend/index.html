<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A-Schedule</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="landing-body">
    <div class="hero">
      <div class="hero-logo">A<span>-</span>Schedule</div>
      <p class="hero-tagline">Intelligent shift scheduling for modern teams. Build schedules in minutes, not hours.</p>

      <div class="company-badge" id="company-badge">
        Welcome back, <span id="company-name-display">—</span>
      </div>

      <div class="btn-group" id="logged-out-btns">
        <a href="login.html" class="btn btn-primary" style="padding:0.65rem 1.5rem;font-size:0.9rem">Sign In</a>
        <a href="signup.html" class="btn btn-secondary" style="padding:0.65rem 1.5rem;font-size:0.9rem">Create Account</a>
      </div>

      <div class="btn-group" id="logged-in-btns" style="display:none">
        <a href="dashboard.html" class="btn btn-primary" style="padding:0.65rem 1.5rem;font-size:0.9rem">Go to Dashboard</a>
        <button class="btn btn-ghost" style="padding:0.65rem 1.5rem;font-size:0.9rem" onclick="logout()">Sign Out</button>
      </div>
    </div>
  </div>

  <script src="js/auth.js"></script>
  <script>
    const company = getCompany();
    if (getToken() && company) {
      document.getElementById("logged-out-btns").style.display = "none";
      document.getElementById("logged-in-btns").style.display = "flex";
      document.getElementById("company-badge").style.display = "inline-block";
      document.getElementById("company-name-display").textContent = company.name;
    }
  </script>
</body>
</html>
