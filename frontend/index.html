<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A-Schedule</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="landing-body">
  <div class="bg-grid"></div>
  <div class="glow"></div>
  <div class="glow2"></div>

  <div class="hero">
    <div class="hero-logo">A-Schedule</div>
    <p class="hero-tagline">Intelligent shift scheduling for modern teams</p>

    <div class="company-badge" id="company-badge">
      Welcome back, <span id="company-name-display">—</span>
    </div>

    <div class="btn-group" id="logged-out-btns">
      <a href="login.html" class="btn-hero-primary">⚡ Sign In</a>
      <a href="signup.html" class="btn-hero-secondary">✨ Create Account</a>
    </div>

    <div class="btn-group" id="logged-in-btns" style="display:none">
      <a href="dashboard.html" class="btn-hero-primary">⚡ Dashboard</a>
      <a href="setup.html" class="btn-hero-secondary">⚙️ Setup</a>
      <button class="btn-hero-ghost" onclick="logout()">Sign Out</button>
    </div>
  </div>

  <script>
    const API = "http://34.28.196.192:5000";
    const token = localStorage.getItem("token");
    const company = localStorage.getItem("company") ? JSON.parse(localStorage.getItem("company")) : null;

    if (token && company) {
      document.getElementById("logged-out-btns").style.display = "none";
      document.getElementById("logged-in-btns").style.display = "flex";
      document.getElementById("company-badge").style.display = "inline-flex";
      document.getElementById("company-name-display").textContent = company.name;
    }

    function logout() {
      fetch(`${API}/logout`, { method: "POST", headers: { "Authorization": `Bearer ${token}` } })
        .finally(() => { localStorage.clear(); window.location.reload(); });
    }
  </script>
</body>
</html>
