<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calendar — A-Schedule</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <style>
    /* ── Calendar layout ── */
    .cal-nav {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 1.25rem;
    }
    .cal-nav-center { display: flex; align-items: center; gap: 0.75rem; }
    .cal-week-label { font-size: 1rem; font-weight: 600; color: var(--text); min-width: 220px; text-align: center; }
    .cal-nav-btn {
      background: var(--surface2); border: 1px solid var(--border); color: var(--text-secondary);
      width: 32px; height: 32px; border-radius: 6px; cursor: pointer;
      display: flex; align-items: center; justify-content: center; font-size: 1rem;
      transition: all 0.1s; font-family: inherit;
    }
    .cal-nav-btn:hover:not(:disabled) { border-color: var(--accent); color: var(--accent-text); }
    .cal-nav-btn:disabled { opacity: 0.3; cursor: not-allowed; }
    .cal-today-btn {
      background: var(--surface2); border: 1px solid var(--border); color: var(--text-secondary);
      padding: 0.35rem 0.75rem; border-radius: 6px; cursor: pointer;
      font-size: 0.8rem; font-family: inherit; font-weight: 500; transition: all 0.1s;
    }
    .cal-today-btn:hover { border-color: var(--accent); color: var(--accent-text); }

    /* ── Grid ── */
    .cal-grid {
      display: grid;
      grid-template-columns: 60px repeat(7, 1fr);
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
    }
    .cal-header-cell {
      background: var(--surface2); border-bottom: 1px solid var(--border);
      padding: 0.6rem 0.5rem; text-align: center;
    }
    .cal-header-cell.time-col { border-right: 1px solid var(--border); }
    .cal-day-name { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.5px; color: var(--text-muted); font-weight: 500; }
    .cal-day-num  { font-size: 1rem; font-weight: 600; color: var(--text); margin-top: 0.15rem; }
    .cal-day-num.today {
      background: var(--accent); color: white;
      width: 28px; height: 28px; border-radius: 50%;
      display: inline-flex; align-items: center; justify-content: center;
      margin-top: 0.15rem;
    }

    /* ── All-day row ── */
    .cal-allday-label {
      background: var(--surface); border-right: 1px solid var(--border);
      border-bottom: 1px solid var(--border); padding: 0.4rem 0.5rem;
      font-size: 0.65rem; color: var(--text-muted); text-align: right;
      display: flex; align-items: center; justify-content: flex-end;
    }
    .cal-allday-cell {
      background: var(--surface); border-bottom: 1px solid var(--border);
      border-right: 1px solid var(--border); padding: 0.3rem 0.25rem;
      min-height: 36px;
    }
    .cal-allday-cell:last-child { border-right: none; }

    /* ── Shift blocks ── */
    .shift-block {
      border-radius: 5px; padding: 0.25rem 0.4rem; margin-bottom: 0.2rem;
      font-size: 0.72rem; line-height: 1.3; cursor: pointer;
      background: var(--accent-subtle); border-left: 3px solid var(--accent);
      color: var(--accent-text); transition: opacity 0.15s;
      position: relative;
    }
    .shift-block:hover { opacity: 0.8; }
    .shift-block .shift-name { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .shift-block .shift-time { opacity: 0.8; white-space: nowrap; }
    .shift-block .shift-delete {
      position: absolute; top: 2px; right: 3px;
      font-size: 0.75rem; color: var(--text-muted); opacity: 0;
      transition: opacity 0.1s; cursor: pointer; line-height: 1;
      background: none; border: none; padding: 0; font-family: inherit;
    }
    .shift-block:hover .shift-delete { opacity: 1; }
    .shift-block .shift-delete:hover { color: #f87171; }

    /* ── Empty cell ── */
    .cal-empty { color: var(--text-muted); font-size: 0.75rem; padding: 0.5rem; text-align: center; opacity: 0.4; }

    /* ── Range badge ── */
    .range-badge {
      font-size: 0.75rem; color: var(--text-muted);
      background: var(--surface2); border: 1px solid var(--border);
      border-radius: 5px; padding: 0.25rem 0.6rem;
    }

    /* ── Legend ── */
    .cal-legend { display: flex; gap: 0.75rem; flex-wrap: wrap; margin-top: 1rem; }
    .legend-item { display: flex; align-items: center; gap: 0.35rem; font-size: 0.75rem; color: var(--text-secondary); }
    .legend-dot { width: 10px; height: 10px; border-radius: 2px; background: var(--accent); opacity: 0.7; }

    /* ── Modal ── */
    .modal-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.5);
      display: flex; align-items: center; justify-content: center;
      z-index: 300; animation: fadeIn 0.15s ease;
    }
    .modal {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 12px; padding: 1.5rem; width: 100%; max-width: 340px;
      animation: fadeUp 0.2s ease;
    }
    .modal-title { font-size: 1rem; font-weight: 600; margin-bottom: 1rem; }
    .modal-row { display: flex; justify-content: space-between; font-size: 0.85rem; padding: 0.4rem 0; border-bottom: 1px solid var(--border); color: var(--text-secondary); }
    .modal-row:last-of-type { border-bottom: none; }
    .modal-row strong { color: var(--text); }
    .modal-actions { display: flex; gap: 0.5rem; margin-top: 1.25rem; justify-content: flex-end; }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  </style>
</head>
<body>
  <div class="app-layout">
    <aside class="sidebar">
      <a href="index.html" class="sidebar-logo">A-Schedule</a>
      <nav class="sidebar-nav">
        <span class="sidebar-section">Workspace</span>
        <a href="dashboard.html" class="nav-item" data-page="dashboard"><span class="icon">👥</span> Workers</a>
        <a href="schedule.html" class="nav-item" data-page="schedule"><span class="icon">📅</span> Schedule</a>
        <a href="calendar.html" class="nav-item active" data-page="calendar"><span class="icon">🗓</span> Calendar</a>
        <span class="sidebar-section">Account</span>
        <a href="setup.html" class="nav-item" data-page="setup"><span class="icon">⚙️</span> Setup</a>
        <a href="settings.html" class="nav-item" data-page="settings"><span class="icon">🎨</span> Settings</a>
      </nav>
      <div class="sidebar-bottom">
        <div class="sidebar-company">
          <div class="sidebar-company-avatar" id="sidebar-company-initial">—</div>
          <span class="sidebar-company-name" id="sidebar-company-name">—</span>
        </div>
        <button class="nav-item" onclick="logout()" style="color:#f87171"><span class="icon">🚪</span> Sign Out</button>
      </div>
    </aside>

    <main class="main-content">
      <div class="page-header">
        <div>
          <h1>Calendar</h1>
          <p class="subtitle">Weekly view of your generated schedule.</p>
        </div>
        <a href="schedule.html" class="btn btn-primary">+ Build Schedule</a>
      </div>

      <!-- Navigation -->
      <div class="cal-nav">
        <div class="cal-nav-center">
          <button class="cal-nav-btn" id="btn-prev" onclick="changeWeek(-1)">‹</button>
          <span class="cal-week-label" id="week-label">—</span>
          <button class="cal-nav-btn" id="btn-next" onclick="changeWeek(1)">›</button>
          <button class="cal-today-btn" onclick="goToToday()">Today</button>
        </div>
        <div class="range-badge" id="range-badge"></div>
      </div>

      <!-- Calendar grid -->
      <div class="card" style="padding:0; overflow:hidden">
        <div class="cal-grid" id="cal-grid">
          <div style="padding:2rem;color:var(--text-muted);text-align:center;grid-column:1/-1">Loading...</div>
        </div>
        <div class="cal-legend" style="padding:0.75rem 1rem 1rem" id="cal-legend"></div>
      </div>
    </main>
  </div>

  <!-- Shift detail modal -->
  <div class="modal-overlay" id="modal" style="display:none" onclick="closeModal(event)">
    <div class="modal" onclick="event.stopPropagation()">
      <div class="modal-title">Shift Details</div>
      <div id="modal-body"></div>
      <div class="modal-actions">
        <button class="btn btn-ghost" onclick="document.getElementById('modal').style.display='none'">Close</button>
        <button class="btn btn-danger-soft" style="border:1px solid rgba(248,113,113,0.3)" id="modal-delete-btn">Remove Shift</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script src="js/auth.js"></script>
  <script>
    if (!getToken()) window.location.href = "login.html";
    initSidebar("calendar");

    // ── Constants ──────────────────────────────────────
    const DAYS_OF_WEEK = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
    const DAYS_SHORT   = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
    const MONTHS       = ["January","February","March","April","May","June","July","August","September","October","November","December"];

    // Range: 3 months back, 6 months forward
    const today = new Date();
    today.setHours(0,0,0,0);
    const MIN_DATE = new Date(today); MIN_DATE.setMonth(MIN_DATE.getMonth() - 3);
    const MAX_DATE = new Date(today); MAX_DATE.setMonth(MAX_DATE.getMonth() + 6);

    // Current week start (Sunday)
    let weekStart = getWeekStart(new Date());
    let allSchedule = [];

    function getWeekStart(date) {
      const d = new Date(date);
      d.setHours(0,0,0,0);
      d.setDate(d.getDate() - d.getDay()); // back to Sunday
      return d;
    }

    function addDays(date, n) {
      const d = new Date(date);
      d.setDate(d.getDate() + n);
      return d;
    }

    function fmtDate(date) {
      return date.toLocaleDateString("en-US", { month: "short", day: "numeric" });
    }

    function fmtFull(date) {
      return date.toLocaleDateString("en-US", { weekday:"long", month:"long", day:"numeric", year:"numeric" });
    }

    function showToast(msg, type = "success") {
      const t = document.getElementById("toast");
      t.textContent = msg; t.className = `toast ${type} show`;
      setTimeout(() => t.className = "toast", 3000);
    }

    function changeWeek(dir) {
      const next = addDays(weekStart, dir * 7);
      const nextEnd = addDays(next, 6);
      if (next < MIN_DATE && dir < 0) return;
      if (nextEnd > MAX_DATE && dir > 0) return;
      weekStart = next;
      renderCalendar();
    }

    function goToToday() {
      weekStart = getWeekStart(new Date());
      renderCalendar();
    }

    function updateNavButtons() {
      const prevStart = addDays(weekStart, -7);
      const nextEnd   = addDays(weekStart, 13);
      document.getElementById("btn-prev").disabled = prevStart < MIN_DATE;
      document.getElementById("btn-next").disabled = nextEnd   > MAX_DATE;

      // Range badge
      const moBack  = Math.round((today - MIN_DATE) / (1000*60*60*24*30));
      const moFwd   = Math.round((MAX_DATE - today) / (1000*60*60*24*30));
      document.getElementById("range-badge").textContent = `±${moBack}mo back · ${moFwd}mo forward`;
    }

    function renderCalendar() {
      updateNavButtons();
      const weekEnd = addDays(weekStart, 6);

      // Week label
      if (weekStart.getMonth() === weekEnd.getMonth()) {
        document.getElementById("week-label").textContent =
          `${MONTHS[weekStart.getMonth()]} ${weekStart.getDate()}–${weekEnd.getDate()}, ${weekStart.getFullYear()}`;
      } else {
        document.getElementById("week-label").textContent =
          `${fmtDate(weekStart)} – ${fmtDate(weekEnd)}, ${weekStart.getFullYear()}`;
      }

      // Build day columns for this week (Sun-Sat)
      const weekDays = Array.from({length:7}, (_, i) => addDays(weekStart, i));

      // Group schedule by day-of-week name
      const byDay = {};
      DAYS_OF_WEEK.forEach(d => byDay[d] = []);
      allSchedule.forEach(s => { if (byDay[s.day]) byDay[s.day].push(s); });

      // Build grid HTML
      let html = "";

      // Header row
      html += `<div class="cal-header-cell time-col"></div>`;
      weekDays.forEach(d => {
        const isToday = d.toDateString() === today.toDateString();
        const dayName = DAYS_OF_WEEK[d.getDay()];
        const hasShifts = byDay[dayName].length > 0;
        html += `<div class="cal-header-cell" style="border-right:1px solid var(--border)">
          <div class="cal-day-name">${DAYS_SHORT[d.getDay()]}</div>
          <div class="cal-day-num${isToday ? ' today' : ''}">${d.getDate()}</div>
          ${hasShifts ? `<div style="font-size:0.65rem;color:var(--accent-text);margin-top:0.15rem">${byDay[dayName].length} shift${byDay[dayName].length>1?'s':''}</div>` : ''}
        </div>`;
      });

      // Shifts row
      html += `<div class="cal-allday-label">Shifts</div>`;
      weekDays.forEach(d => {
        const dayName = DAYS_OF_WEEK[d.getDay()];
        const shifts = byDay[dayName];
        html += `<div class="cal-allday-cell">`;
        if (shifts.length) {
          shifts.forEach(s => {
            html += `<div class="shift-block" onclick="openModal(${s.id})">
              <button class="shift-delete" onclick="event.stopPropagation(); deleteShift(${s.id})" title="Remove">×</button>
              <div class="shift-name">${s.worker}</div>
              <div class="shift-time">${s.start_time}–${s.end_time}</div>
              ${s.role ? `<div class="shift-time">${s.role}</div>` : ''}
            </div>`;
          });
        } else {
          html += `<div class="cal-empty">—</div>`;
        }
        html += `</div>`;
      });

      document.getElementById("cal-grid").innerHTML = html;

      // Legend — unique workers
      const workers = [...new Set(allSchedule.map(s => s.worker))];
      document.getElementById("cal-legend").innerHTML = workers.length
        ? workers.map(w => `<div class="legend-item"><div class="legend-dot"></div>${w}</div>`).join("")
        : "";
    }

    function openModal(shiftId) {
      const s = allSchedule.find(x => x.id === shiftId);
      if (!s) return;
      document.getElementById("modal-body").innerHTML = `
        <div class="modal-row"><span>Worker</span><strong>${s.worker}</strong></div>
        <div class="modal-row"><span>Day</span><strong>${s.day}</strong></div>
        <div class="modal-row"><span>Start</span><strong>${s.start_time}</strong></div>
        <div class="modal-row"><span>End</span><strong>${s.end_time}</strong></div>
        <div class="modal-row"><span>Role</span><strong>${s.role || '—'}</strong></div>`;
      document.getElementById("modal-delete-btn").onclick = () => deleteShift(shiftId, true);
      document.getElementById("modal").style.display = "flex";
    }

    function closeModal(e) {
      document.getElementById("modal").style.display = "none";
    }

    function deleteShift(id, fromModal = false) {
      fetch(`${API}/schedule/${id}`, { method: "DELETE", headers: authHeaders() })
        .then(r => r.json()).then(data => {
          if (data.status === "success") {
            showToast("Shift removed");
            if (fromModal) document.getElementById("modal").style.display = "none";
            allSchedule = allSchedule.filter(s => s.id !== id);
            renderCalendar();
          } else {
            showToast("Failed to remove shift", "error");
          }
        });
    }

    // ── Initial load ──────────────────────────────────
    fetch(`${API}/schedule`, { headers: authHeaders() }).then(r => r.json()).then(data => {
      allSchedule = data.schedule || [];
      renderCalendar();
    });
  </script>
</body>
</html>
