<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calendar — A-Schedule</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <style>
    /* ── Nav ── */
    .cal-toolbar {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 1.25rem; gap: 1rem; flex-wrap: wrap;
    }
    .cal-nav-left  { display: flex; align-items: center; gap: 0.5rem; }
    .cal-nav-right { display: flex; align-items: center; gap: 0.5rem; }
    .cal-period-label {
      font-size: 1rem; font-weight: 600; color: var(--text);
      min-width: 200px; text-align: center;
    }
    .cal-btn {
      background: var(--surface2); border: 1px solid var(--border); color: var(--text-secondary);
      padding: 0.4rem 0.75rem; border-radius: 6px; cursor: pointer;
      font-size: 0.82rem; font-family: inherit; font-weight: 500; transition: all 0.1s;
    }
    .cal-btn:hover:not(:disabled) { border-color: var(--accent); color: var(--accent-text); }
    .cal-btn:disabled { opacity: 0.3; cursor: not-allowed; }
    .cal-btn.icon-btn { padding: 0.4rem 0.6rem; font-size: 1rem; }
    .view-toggle { display: flex; background: var(--surface2); border: 1px solid var(--border); border-radius: 6px; overflow: hidden; }
    .view-btn {
      background: transparent; border: none; color: var(--text-secondary);
      padding: 0.4rem 0.85rem; font-size: 0.82rem; font-family: inherit;
      font-weight: 500; cursor: pointer; transition: all 0.1s; border-right: 1px solid var(--border);
    }
    .view-btn:last-child { border-right: none; }
    .view-btn.active { background: var(--accent); color: white; }

    /* ── Shared grid styles ── */
    .cal-wrap { border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
    .cal-col-header {
      background: var(--surface2); border-bottom: 1px solid var(--border);
      padding: 0.55rem 0.5rem; text-align: center;
    }
    .day-name-sm  { font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.5px; color: var(--text-muted); font-weight: 500; }
    .day-num-lg   { font-size: 1rem; font-weight: 600; color: var(--text); margin-top: 0.1rem; }
    .day-num-lg.is-today {
      background: var(--accent); color: white;
      width: 26px; height: 26px; border-radius: 50%;
      display: inline-flex; align-items: center; justify-content: center;
    }

    /* ── Shift block ── */
    .shift-block {
      border-radius: 5px; padding: 0.25rem 0.45rem; margin-bottom: 0.2rem;
      font-size: 0.72rem; line-height: 1.35; cursor: pointer;
      background: var(--accent-subtle); border-left: 3px solid var(--accent);
      color: var(--accent-text); transition: opacity 0.1s; position: relative;
    }
    .shift-block:hover { opacity: 0.75; }
    .shift-block .s-name { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .shift-block .s-time { opacity: 0.75; }
    .shift-block .s-del {
      position: absolute; top: 2px; right: 3px; font-size: 0.8rem;
      color: var(--text-muted); opacity: 0; transition: opacity 0.1s;
      cursor: pointer; background: none; border: none; padding: 0; font-family: inherit;
    }
    .shift-block:hover .s-del { opacity: 1; }
    .shift-block .s-del:hover { color: #f87171; }
    .empty-day { color: var(--text-muted); font-size: 0.75rem; opacity: 0.4; text-align: center; padding: 0.75rem 0; }

    /* ── WEEK VIEW ── */
    .week-grid {
      display: grid; grid-template-columns: repeat(7, 1fr);
    }
    .week-cell {
      border-right: 1px solid var(--border); padding: 0.4rem 0.3rem; min-height: 80px;
    }
    .week-cell:last-child { border-right: none; }

    /* ── DAY VIEW ── */
    .day-view { padding: 1.25rem; }
    .day-view-header { font-size: 1.1rem; font-weight: 600; margin-bottom: 1rem; color: var(--text); }
    .day-view-empty { color: var(--text-muted); font-size: 0.9rem; padding: 2rem; text-align: center; }
    .day-shift-card {
      display: flex; align-items: center; gap: 1rem;
      background: var(--surface2); border: 1px solid var(--border);
      border-left: 4px solid var(--accent); border-radius: 8px;
      padding: 0.75rem 1rem; margin-bottom: 0.6rem; cursor: pointer; transition: opacity 0.1s;
    }
    .day-shift-card:hover { opacity: 0.8; }
    .day-shift-time { font-size: 0.82rem; color: var(--text-muted); min-width: 90px; }
    .day-shift-worker { font-weight: 600; font-size: 0.9rem; }
    .day-shift-role { font-size: 0.78rem; color: var(--text-secondary); margin-top: 0.1rem; }
    .day-shift-del { margin-left: auto; }

    /* ── MONTH VIEW ── */
    .month-grid {
      display: grid; grid-template-columns: repeat(7, 1fr);
    }
    .month-day-header {
      background: var(--surface2); border-bottom: 1px solid var(--border);
      border-right: 1px solid var(--border); padding: 0.4rem;
      font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.5px;
      color: var(--text-muted); text-align: center; font-weight: 500;
    }
    .month-day-header:last-child { border-right: none; }
    .month-cell {
      border-right: 1px solid var(--border); border-bottom: 1px solid var(--border);
      padding: 0.35rem 0.3rem; min-height: 80px; vertical-align: top;
    }
    .month-cell:nth-child(7n) { border-right: none; }
    .month-cell.other-month { opacity: 0.35; }
    .month-cell.is-today { background: var(--accent-subtle); }
    .month-date {
      font-size: 0.78rem; font-weight: 600; color: var(--text-secondary);
      margin-bottom: 0.3rem; text-align: right; padding-right: 0.2rem;
    }
    .month-date.is-today {
      color: var(--accent-text); font-weight: 700;
    }
    .month-more {
      font-size: 0.68rem; color: var(--text-muted); padding: 0.1rem 0.2rem; cursor: pointer;
    }
    .month-more:hover { color: var(--accent-text); }

    /* ── Range badge ── */
    .range-badge {
      font-size: 0.72rem; color: var(--text-muted);
      background: var(--surface2); border: 1px solid var(--border);
      border-radius: 5px; padding: 0.25rem 0.6rem; white-space: nowrap;
    }

    /* ── Modal ── */
    .modal-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.5);
      display: flex; align-items: center; justify-content: center; z-index: 300;
    }
    .modal {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 12px; padding: 1.5rem; width: 100%; max-width: 320px;
      animation: fadeUp 0.2s ease;
    }
    .modal-title { font-size: 1rem; font-weight: 600; margin-bottom: 1rem; }
    .modal-row { display: flex; justify-content: space-between; font-size: 0.85rem; padding: 0.4rem 0; border-bottom: 1px solid var(--border); color: var(--text-secondary); }
    .modal-row:last-of-type { border-bottom: none; }
    .modal-row strong { color: var(--text); }
    .modal-actions { display: flex; gap: 0.5rem; margin-top: 1.25rem; justify-content: flex-end; }
  </style>
</head>
<body>
  <div class="app-layout">
    <aside class="sidebar">
      <a href="index.html" class="sidebar-logo">A-Schedule</a>
      <nav class="sidebar-nav">
        <span class="sidebar-section">Workspace</span>
        <a href="dashboard.html" class="nav-item" data-page="dashboard"><span class="icon">👥</span> Workers</a>
        <a href="schedule.html" class="nav-item" data-page="schedule"><span class="icon">📅</span> Schedule</a>
        <a href="calendar.html" class="nav-item active" data-page="calendar"><span class="icon">🗓</span> Calendar</a>
        <span class="sidebar-section">Account</span>
        <a href="setup.html" class="nav-item" data-page="setup"><span class="icon">⚙️</span> Setup</a>
        <a href="settings.html" class="nav-item" data-page="settings"><span class="icon">🎨</span> Settings</a>
      </nav>
      <div class="sidebar-bottom">
        <div class="sidebar-company">
          <div class="sidebar-company-avatar" id="sidebar-company-initial">—</div>
          <span class="sidebar-company-name" id="sidebar-company-name">—</span>
        </div>
        <button class="nav-item" onclick="logout()" style="color:#f87171"><span class="icon">🚪</span> Sign Out</button>
      </div>
    </aside>

    <main class="main-content">
      <div class="page-header">
        <div><h1>Calendar</h1><p class="subtitle">View your schedule by day, week, or month.</p></div>
        <a href="schedule.html" class="btn btn-primary">+ Build Schedule</a>
      </div>

      <!-- Toolbar -->
      <div class="cal-toolbar">
        <div class="cal-nav-left">
          <button class="cal-btn icon-btn" id="btn-prev" onclick="navigate(-1)">‹</button>
          <span class="cal-period-label" id="period-label">—</span>
          <button class="cal-btn icon-btn" id="btn-next" onclick="navigate(1)">›</button>
          <button class="cal-btn" onclick="goToToday()">Today</button>
        </div>
        <div class="cal-nav-right">
          <span class="range-badge">3 mo back · 6 mo forward</span>
          <div class="view-toggle">
            <button class="view-btn active" id="vbtn-day"   onclick="setView('day')">Day</button>
            <button class="view-btn"        id="vbtn-week"  onclick="setView('week')">Week</button>
            <button class="view-btn"        id="vbtn-month" onclick="setView('month')">Month</button>
          </div>
        </div>
      </div>

      <!-- Calendar output -->
      <div class="card" style="padding:0;overflow:hidden" id="cal-card">
        <div id="cal-output" style="padding:2rem;color:var(--text-muted);text-align:center">Loading...</div>
      </div>
    </main>
  </div>

  <!-- Modal -->
  <div class="modal-overlay" id="modal" style="display:none" onclick="if(event.target===this)closeModal()">
    <div class="modal">
      <div class="modal-title">Shift Details</div>
      <div id="modal-body"></div>
      <div class="modal-actions">
        <button class="btn btn-ghost" onclick="closeModal()">Close</button>
        <button class="btn btn-danger-soft" style="border:1px solid rgba(248,113,113,0.3)" id="modal-del-btn">Remove</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>
  <script src="js/auth.js"></script>
  <script>
    if (!getToken()) window.location.href = "login.html";
    initSidebar("calendar");

    const DAYS_FULL  = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
    const DAYS_SHORT = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
    const MONTHS     = ["January","February","March","April","May","June","July","August","September","October","November","December"];

    const todayDate = new Date(); todayDate.setHours(0,0,0,0);
    const MIN_DATE  = new Date(todayDate); MIN_DATE.setMonth(MIN_DATE.getMonth() - 3);
    const MAX_DATE  = new Date(todayDate); MAX_DATE.setMonth(MAX_DATE.getMonth() + 6);

    let currentView = "week";
    let cursor = new Date(todayDate); // day cursor
    let allSchedule = [];

    function addDays(d, n) { const x = new Date(d); x.setDate(x.getDate() + n); return x; }
    function addMonths(d, n) { const x = new Date(d); x.setMonth(x.getMonth() + n); return x; }
    function sameDay(a, b) { return a.toDateString() === b.toDateString(); }
    function getWeekStart(d) { const x = new Date(d); x.setDate(x.getDate() - x.getDay()); return x; }
    function getMonthStart(d) { return new Date(d.getFullYear(), d.getMonth(), 1); }

    function shiftsForDay(dayName) { return allSchedule.filter(s => s.day === dayName); }
    function shiftsForDate(date)   { return shiftsForDay(DAYS_FULL[date.getDay()]); }

    function showToast(msg, type="success") {
      const t = document.getElementById("toast");
      t.textContent = msg; t.className = `toast ${type} show`;
      setTimeout(() => t.className = "toast", 3000);
    }

    function setView(v) {
      currentView = v;
      ["day","week","month"].forEach(x => {
        document.getElementById(`vbtn-${x}`).classList.toggle("active", x === v);
      });
      render();
    }

    function navigate(dir) {
      if (currentView === "day")   cursor = addDays(cursor, dir);
      if (currentView === "week")  cursor = addDays(cursor, dir * 7);
      if (currentView === "month") cursor = addMonths(cursor, dir);
      render();
    }

    function goToToday() { cursor = new Date(todayDate); render(); }

    function updateNav() {
      let prevOk, nextOk;
      if (currentView === "day") {
        prevOk = addDays(cursor, -1) >= MIN_DATE;
        nextOk = addDays(cursor,  1) <= MAX_DATE;
      } else if (currentView === "week") {
        prevOk = addDays(getWeekStart(cursor), -1) >= MIN_DATE;
        nextOk = addDays(getWeekStart(cursor), 7)  <= MAX_DATE;
      } else {
        prevOk = addMonths(cursor, -1) >= MIN_DATE;
        nextOk = addMonths(cursor,  1) <= MAX_DATE;
      }
      document.getElementById("btn-prev").disabled = !prevOk;
      document.getElementById("btn-next").disabled = !nextOk;
    }

    function shiftBlock(s, compact=false) {
      return `<div class="shift-block" onclick="openModal(${s.id})">
        <button class="s-del" onclick="event.stopPropagation();deleteShift(${s.id})">×</button>
        <div class="s-name">${s.worker}</div>
        ${!compact ? `<div class="s-time">${s.start_time}–${s.end_time}</div>` : ''}
        ${s.role && !compact ? `<div class="s-time">${s.role}</div>` : ''}
      </div>`;
    }

    function render() {
      updateNav();
      const out = document.getElementById("cal-output");

      if (currentView === "day") renderDay(out);
      else if (currentView === "week") renderWeek(out);
      else renderMonth(out);
    }

    // ── DAY VIEW ──────────────────────────────────────
    function renderDay(out) {
      const dayName = DAYS_FULL[cursor.getDay()];
      const shifts  = shiftsForDate(cursor);
      const isToday = sameDay(cursor, todayDate);

      document.getElementById("period-label").textContent =
        cursor.toLocaleDateString("en-US", { weekday:"long", month:"long", day:"numeric", year:"numeric" });

      let html = `<div class="day-view">`;
      html += `<div class="day-view-header">${isToday ? "Today — " : ""}${dayName}</div>`;

      if (!shifts.length) {
        html += `<div class="day-view-empty">No shifts scheduled for this day.<br><a href="schedule.html" style="color:var(--accent-text);text-decoration:none;font-size:0.85rem">Build a schedule →</a></div>`;
      } else {
        const sorted = [...shifts].sort((a,b) => a.start_time.localeCompare(b.start_time));
        sorted.forEach(s => {
          html += `<div class="day-shift-card" onclick="openModal(${s.id})">
            <div class="day-shift-time">${s.start_time} – ${s.end_time}</div>
            <div><div class="day-shift-worker">${s.worker}</div><div class="day-shift-role">${s.role || 'No role'}</div></div>
            <div class="day-shift-del"><button class="btn btn-danger-soft" style="border:1px solid rgba(248,113,113,0.25)" onclick="event.stopPropagation();deleteShift(${s.id})">Remove</button></div>
          </div>`;
        });
      }
      html += `</div>`;
      out.innerHTML = html;
    }

    // ── WEEK VIEW ─────────────────────────────────────
    function renderWeek(out) {
      const ws = getWeekStart(cursor);
      const we = addDays(ws, 6);
      const weekDays = Array.from({length:7}, (_,i) => addDays(ws, i));

      if (ws.getMonth() === we.getMonth()) {
        document.getElementById("period-label").textContent =
          `${MONTHS[ws.getMonth()]} ${ws.getDate()}–${we.getDate()}, ${ws.getFullYear()}`;
      } else {
        document.getElementById("period-label").textContent =
          `${ws.toLocaleDateString("en-US",{month:"short",day:"numeric"})} – ${we.toLocaleDateString("en-US",{month:"short",day:"numeric"})}, ${ws.getFullYear()}`;
      }

      let html = `<div class="cal-wrap"><div class="week-grid">`;

      // Headers
      weekDays.forEach(d => {
        const isToday = sameDay(d, todayDate);
        const cnt = shiftsForDate(d).length;
        html += `<div class="cal-col-header" style="border-right:1px solid var(--border)">
          <div class="day-name-sm">${DAYS_SHORT[d.getDay()]}</div>
          <div class="day-num-lg${isToday?' is-today':''}">${d.getDate()}</div>
          ${cnt ? `<div style="font-size:0.65rem;color:var(--accent-text);margin-top:0.1rem">${cnt} shift${cnt>1?'s':''}</div>` : ''}
        </div>`;
      });

      // Cells
      weekDays.forEach(d => {
        const shifts = [...shiftsForDate(d)].sort((a,b) => a.start_time.localeCompare(b.start_time));
        html += `<div class="week-cell">`;
        if (shifts.length) shifts.forEach(s => html += shiftBlock(s));
        else html += `<div class="empty-day">—</div>`;
        html += `</div>`;
      });

      html += `</div></div>`;
      out.innerHTML = html;
    }

    // ── MONTH VIEW ────────────────────────────────────
    function renderMonth(out) {
      const ms = getMonthStart(cursor);
      const me = new Date(cursor.getFullYear(), cursor.getMonth() + 1, 0); // last day

      document.getElementById("period-label").textContent =
        `${MONTHS[cursor.getMonth()]} ${cursor.getFullYear()}`;

      // Grid starts from Sunday of the first week
      const gridStart = getWeekStart(ms);
      // Grid ends Saturday of the last week
      const gridEnd   = addDays(getWeekStart(me), 6);

      let html = `<div class="cal-wrap"><div class="month-grid">`;

      // Day name headers
      DAYS_SHORT.forEach(d => html += `<div class="month-day-header">${d}</div>`);

      // Day cells
      let d = new Date(gridStart);
      while (d <= gridEnd) {
        const isCurrentMonth = d.getMonth() === cursor.getMonth();
        const isToday = sameDay(d, todayDate);
        const dayName = DAYS_FULL[d.getDay()];
        const shifts  = shiftsForDay(dayName);
        const maxShow = 2;

        html += `<div class="month-cell${!isCurrentMonth?' other-month':''}${isToday?' is-today':''}">`;
        html += `<div class="month-date${isToday?' is-today':''}">${d.getDate()}</div>`;

        if (shifts.length) {
          shifts.slice(0, maxShow).forEach(s => html += shiftBlock(s, true));
          if (shifts.length > maxShow) {
            html += `<div class="month-more" onclick="cursor=new Date(${d.getTime()});setView('day')">+${shifts.length - maxShow} more</div>`;
          }
        }
        html += `</div>`;
        d = addDays(d, 1);
      }

      html += `</div></div>`;
      out.innerHTML = html;
    }

    // ── Modal ─────────────────────────────────────────
    function openModal(id) {
      const s = allSchedule.find(x => x.id === id);
      if (!s) return;
      document.getElementById("modal-body").innerHTML = `
        <div class="modal-row"><span>Worker</span><strong>${s.worker}</strong></div>
        <div class="modal-row"><span>Day</span><strong>${s.day}</strong></div>
        <div class="modal-row"><span>Start</span><strong>${s.start_time}</strong></div>
        <div class="modal-row"><span>End</span><strong>${s.end_time}</strong></div>
        <div class="modal-row"><span>Role</span><strong>${s.role || '—'}</strong></div>`;
      document.getElementById("modal-del-btn").onclick = () => deleteShift(id, true);
      document.getElementById("modal").style.display = "flex";
    }

    function closeModal() { document.getElementById("modal").style.display = "none"; }

    function deleteShift(id, fromModal=false) {
      fetch(`${API}/schedule/${id}`, { method:"DELETE", headers: authHeaders() })
        .then(r => r.json()).then(data => {
          if (data.status === "success") {
            showToast("Shift removed");
            if (fromModal) closeModal();
            allSchedule = allSchedule.filter(s => s.id !== id);
            render();
          } else showToast("Failed to remove shift", "error");
        });
    }

    // ── Load ──────────────────────────────────────────
    fetch(`${API}/schedule`, { headers: authHeaders() }).then(r => r.json()).then(data => {
      allSchedule = data.schedule || [];
      render();
    });
  </script>
</body>
</html>
