<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up — A-Schedule</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-body">
  <div class="auth-card">
    <div class="auth-logo">A-Schedule</div>
    <p class="auth-subtitle">Create your free account</p>

    <div class="error-msg" id="error"></div>

    <div class="form-group">
      <label>Company Name</label>
      <input type="text" id="company" placeholder="e.g. Dunkin' Main St" autofocus>
    </div>
    <div class="form-group">
      <label>Email</label>
      <input type="email" id="email" placeholder="you@company.com">
    </div>
    <div class="form-group" style="margin-bottom:1.5rem">
      <label>Password</label>
      <input type="password" id="password" placeholder="Min. 6 characters">
      <span class="hint">At least 6 characters</span>
    </div>

    <button class="btn btn-primary btn-full" onclick="signup()">Create Account</button>
    <p class="footer-link">Already have an account? <a href="login.html">Sign in</a></p>
  </div>

  <script>
    const API = "http://34.28.196.192:5000";
    const t = localStorage.getItem("theme") || "dark";
    const a = localStorage.getItem("accent") || "emerald";
    document.body.classList.add(`theme-${t}`, `accent-${a}`);
    if (localStorage.getItem("token")) window.location.href = "dashboard.html";

    function signup() {
      const name = document.getElementById("company").value.trim();
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;
      const err = document.getElementById("error");
      err.style.display = "none";
      if (!name || !email || !password) { err.textContent = "Please fill in all fields."; err.style.display = "block"; return; }
      if (password.length < 6) { err.textContent = "Password must be at least 6 characters."; err.style.display = "block"; return; }
      fetch(`${API}/signup`, {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ name, email, password })
      }).then(r => r.json()).then(data => {
        if (data.status === "success") {
          localStorage.setItem("token", data.token);
          localStorage.setItem("company", JSON.stringify(data.company));
          window.location.href = "onboarding.html";
        } else { err.textContent = data.message || "Signup failed."; err.style.display = "block"; }
      }).catch(() => { err.textContent = "Could not connect to server."; err.style.display = "block"; });
    }
  </script>
</body>
</html>
