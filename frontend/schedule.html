<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Schedule — A-Schedule</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app-layout">

    <aside class="sidebar">
      <a href="index.html" class="sidebar-logo">A-Schedule</a>
      <nav class="sidebar-nav">
        <span class="sidebar-section">Workspace</span>
        <a href="dashboard.html" class="nav-item" data-page="dashboard">
          <span class="icon">👥</span> Workers
        </a>
        <a href="schedule.html" class="nav-item active" data-page="schedule">
          <span class="icon">📅</span> Schedule
        </a>
        <a href="setup.html" class="nav-item" data-page="setup">
          <span class="icon">⚙️</span> Setup
        </a>
        <a href="add-worker.html" class="nav-item" data-page="add-worker">
          <span class="icon">➕</span> Add Worker
        </a>
      </nav>
      <div class="sidebar-bottom">
        <div class="sidebar-company">
          <div class="sidebar-company-avatar" id="sidebar-company-initial">—</div>
          <span class="sidebar-company-name" id="sidebar-company-name">—</span>
        </div>
        <button class="nav-item" onclick="logout()" style="color:var(--danger)">
          <span class="icon">🚪</span> Sign Out
        </button>
      </div>
    </aside>

    <main class="main-content">
      <div class="page-header">
        <div>
          <h1>Schedule</h1>
          <p class="subtitle">Define shifts and auto-assign workers based on availability and roles.</p>
        </div>
      </div>

      <div class="card">
        <div class="card-title-lg">📋 Shift Requirements</div>
        <div class="label-row"><span>Day</span><span>Start</span><span>End</span><span>Role</span><span>Needed</span><span></span></div>
        <div id="shifts-builder"></div>
        <div class="actions">
          <button class="btn btn-ghost" onclick="addShiftRow()">+ Add Shift</button>
          <button class="btn btn-primary" onclick="generateSchedule()">⚡ Generate Schedule</button>
        </div>
      </div>

      <div class="card" id="schedule-card" style="display:none">
        <div class="card-title-lg">📅 Generated Schedule</div>
        <div id="schedule-output"></div>
      </div>
    </main>
  </div>

  <script src="js/auth.js"></script>
  <script>
    if (!getToken()) window.location.href = "login.html";
    initSidebar("schedule");

    let roles = [];
    const DAYS = ["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday","Sunday"];

    fetch(`${API}/roles`, { headers: authHeaders() }).then(r => r.json()).then(data => {
      roles = data.roles || [];
      addShiftRow();
      loadExistingSchedule();
    });

    function roleOptions() { return roles.length ? roles.map(r => `<option value="${r.id}">${r.name}</option>`).join("") : '<option value="">No roles</option>'; }
    function dayOptions() { return DAYS.map(d => `<option value="${d}">${d}</option>`).join(""); }

    function addShiftRow() {
      const row = document.createElement("div");
      row.className = "shift-row";
      row.innerHTML = `
        <select class="s-day">${dayOptions()}</select>
        <input type="time" class="s-start" value="09:00">
        <input type="time" class="s-end" value="17:00">
        <select class="s-role">${roleOptions()}</select>
        <input type="number" class="s-needed" value="1" min="1" max="20">
        <button class="btn-icon" onclick="this.parentElement.remove()">×</button>`;
      document.getElementById("shifts-builder").appendChild(row);
    }

    function generateSchedule() {
      const rows = document.querySelectorAll(".shift-row");
      const shifts = [...rows].map(row => ({
        day: row.querySelector(".s-day").value,
        start_time: row.querySelector(".s-start").value,
        end_time: row.querySelector(".s-end").value,
        role_id: row.querySelector(".s-role").value,
        workers_needed: row.querySelector(".s-needed").value
      }));
      fetch(`${API}/generate-schedule`, {
        method: "POST", headers: authHeaders(),
        body: JSON.stringify({ shifts })
      }).then(() => loadExistingSchedule());
    }

    function loadExistingSchedule() {
      fetch(`${API}/schedule`, { headers: authHeaders() }).then(r => r.json()).then(data => {
        const schedule = data.schedule || [];
        const card = document.getElementById("schedule-card");
        if (!schedule.length) { card.style.display = "none"; return; }
        card.style.display = "block";
        const byDay = {};
        schedule.forEach(s => { if (!byDay[s.day]) byDay[s.day] = []; byDay[s.day].push(s); });
        let html = `<table><thead><tr><th>Worker</th><th>Start</th><th>End</th><th>Role</th></tr></thead><tbody>`;
        for (const day of DAYS) {
          if (!byDay[day]) continue;
          html += `<tr class="day-header"><td colspan="4">${day}</td></tr>`;
          byDay[day].forEach(s => {
            html += `<tr><td><strong>${s.worker}</strong></td><td>${s.start_time}</td><td>${s.end_time}</td><td>${s.role ? `<span class="role-chip">${s.role}</span>` : '—'}</td></tr>`;
          });
        }
        html += `</tbody></table>`;
        document.getElementById("schedule-output").innerHTML = html;
      });
    }
  </script>
</body>
</html>
