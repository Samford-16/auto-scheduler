<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Schedule — A-Schedule</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <nav>
    <a href="index.html" class="nav-logo">A-Schedule</a>
    <div class="nav-links">
      <a href="dashboard.html">Dashboard</a>
      <a href="schedule.html" class="active">Schedule</a>
      <a href="setup.html">Setup</a>
      <div class="nav-company" id="nav-company">—</div>
      <button class="btn-logout" onclick="logout()">Sign Out</button>
    </div>
  </nav>

  <div class="container">
    <h1>Generate Schedule</h1>
    <p class="subtitle-lg">Define shifts for each day, then let A-Schedule assign workers automatically.</p>

    <div class="card">
      <div class="card-title">📋 Shift Requirements</div>
      <div class="label-row"><span>Day</span><span>Start Time</span><span>End Time</span><span>Role</span><span>Workers Needed</span><span></span></div>
      <div id="shifts-builder"></div>
      <div class="actions">
        <button class="btn btn-ghost" onclick="addShiftRow()">+ Add Shift</button>
        <button class="btn btn-primary" onclick="generateSchedule()">⚡ Generate Schedule</button>
      </div>
    </div>

    <div class="card" id="schedule-card" style="display:none">
      <div class="card-title">📅 Generated Schedule</div>
      <div id="schedule-output"></div>
    </div>
  </div>

  <script src="js/auth.js"></script>
  <script>
    if (!getToken()) window.location.href = "login.html";

    let roles = [];
    const DAYS = ["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday","Sunday"];

    fetch(`${API}/roles`, { headers: authHeaders() }).then(r => r.json()).then(data => {
      roles = data.roles || [];
      addShiftRow();
      loadExistingSchedule();
    });

    function roleOptions() { return roles.map(r => `<option value="${r.id}">${r.name}</option>`).join(""); }
    function dayOptions() { return DAYS.map(d => `<option value="${d}">${d}</option>`).join(""); }

    function addShiftRow() {
      const row = document.createElement("div");
      row.className = "shift-row";
      row.innerHTML = `
        <select class="s-day">${dayOptions()}</select>
        <input type="time" class="s-start" value="04:30">
        <input type="time" class="s-end" value="12:00">
        <select class="s-role">${roles.length ? roleOptions() : '<option value="">No roles</option>'}</select>
        <input type="number" class="s-needed" value="2" min="1" max="20">
        <button class="btn-icon" onclick="this.parentElement.remove()">×</button>`;
      document.getElementById("shifts-builder").appendChild(row);
    }

    function generateSchedule() {
      const rows = document.querySelectorAll(".shift-row");
      const shifts = [...rows].map(row => ({
        day: row.querySelector(".s-day").value,
        start_time: row.querySelector(".s-start").value,
        end_time: row.querySelector(".s-end").value,
        role_id: row.querySelector(".s-role").value,
        workers_needed: row.querySelector(".s-needed").value
      }));
      fetch(`${API}/generate-schedule`, {
        method: "POST", headers: authHeaders(),
        body: JSON.stringify({ shifts })
      }).then(() => loadExistingSchedule());
    }

    function loadExistingSchedule() {
      fetch(`${API}/schedule`, { headers: authHeaders() }).then(r => r.json()).then(data => {
        const schedule = data.schedule || [];
        const card = document.getElementById("schedule-card");
        if (!schedule.length) { card.style.display = "none"; return; }
        card.style.display = "block";
        const byDay = {};
        schedule.forEach(s => { if (!byDay[s.day]) byDay[s.day] = []; byDay[s.day].push(s); });
        let html = `<table><thead><tr><th>Worker</th><th>Start</th><th>End</th><th>Role</th></tr></thead><tbody>`;
        for (const day of DAYS) {
          if (!byDay[day]) continue;
          html += `<tr class="day-header"><td colspan="4">${day}</td></tr>`;
          byDay[day].forEach(s => {
            html += `<tr><td><strong>${s.worker}</strong></td><td>${s.start_time}</td><td>${s.end_time}</td><td>${s.role ? `<span class="role-chip">${s.role}</span>` : '—'}</td></tr>`;
          });
        }
        html += `</tbody></table>`;
        document.getElementById("schedule-output").innerHTML = html;
      });
    }
  </script>
</body>
</html>
