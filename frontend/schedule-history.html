<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Schedule History — A-Schedule</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <style>
    .history-item { border: 1px solid var(--border); border-radius: 8px; margin-bottom: 1rem; overflow: hidden; }
    .history-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 0.85rem 1.1rem; background: var(--surface2); cursor: pointer;
      transition: background 0.1s;
    }
    .history-header:hover { background: var(--surface3); }
    .history-label { font-weight: 600; font-size: 0.9rem; color: var(--text); }
    .history-meta { font-size: 0.78rem; color: var(--text-muted); margin-top: 0.1rem; }
    .history-chevron { color: var(--text-muted); transition: transform 0.2s; font-size: 0.85rem; }
    .history-chevron.open { transform: rotate(90deg); }
    .history-body { display: none; padding: 0; }
    .history-body.open { display: block; }
    .history-body table { width: 100%; font-size: 0.83rem; }
    .history-body th {
      text-align: left; padding: 0.5rem 1rem;
      background: var(--surface); color: var(--text-muted);
      font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.5px;
      border-bottom: 1px solid var(--border);
    }
    .history-body td { padding: 0.55rem 1rem; border-bottom: 1px solid var(--border); color: var(--text-secondary); }
    .history-body tr:last-child td { border-bottom: none; }
    .day-section td { background: var(--surface2); font-weight: 600; color: var(--text); font-size: 0.78rem; }
  </style>
</head>
<body>
  <div class="app-layout">
    <aside class="sidebar">
      <a href="index.html" class="sidebar-logo">A-Schedule</a>
      <nav class="sidebar-nav">
        <span class="sidebar-section">Workspace</span>
        <a href="dashboard.html" class="nav-item" data-page="dashboard"><span class="icon">👥</span> Workers</a>
        <a href="schedule.html" class="nav-item" data-page="schedule"><span class="icon">📅</span> Schedule</a>
        <a href="calendar.html" class="nav-item" data-page="calendar"><span class="icon">🗓</span> Calendar</a>
        <a href="schedule-history.html" class="nav-item active" data-page="history"><span class="icon">🗂</span> History</a>
        <span class="sidebar-section">Account</span>
        <a href="setup.html" class="nav-item" data-page="setup"><span class="icon">⚙️</span> Setup</a>
        <a href="settings.html" class="nav-item" data-page="settings"><span class="icon">🎨</span> Settings</a>
        <a href="audit-log.html" class="nav-item" data-page="audit"><span class="icon">🔍</span> Audit Log</a>
      </nav>
      <div class="sidebar-bottom">
        <div class="sidebar-company">
          <div class="sidebar-company-avatar" id="sidebar-company-initial">—</div>
          <span class="sidebar-company-name" id="sidebar-company-name">—</span>
        </div>
        <button class="nav-item" onclick="logout()" style="color:#f87171"><span class="icon">🚪</span> Sign Out</button>
      </div>
    </aside>

    <main class="main-content">
      <div class="page-header">
        <div>
          <h1>Schedule History</h1>
          <p class="subtitle">Archived schedules from previous generations.</p>
        </div>
        <a href="schedule.html" class="btn btn-primary">+ New Schedule</a>
      </div>

      <div id="history-container">
        <div style="padding:2rem;text-align:center;color:var(--text-muted)">Loading...</div>
      </div>
    </main>
  </div>

  <script src="js/auth.js"></script>
  <script>
    if (!getToken()) window.location.href = "login.html";
    initSidebar("history");

    const DAYS = ["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday","Sunday"];

    function toggle(id) {
      document.getElementById(`body-${id}`).classList.toggle("open");
      document.getElementById(`chev-${id}`).classList.toggle("open");
    }

    function formatDate(ts) {
      return new Date(ts.replace(" ", "T") + "Z").toLocaleString("en-US", {
        month: "short", day: "numeric", year: "numeric",
        hour: "numeric", minute: "2-digit", hour12: true
      });
    }

    fetch(`${API}/schedule-history`, { headers: authHeaders() })
      .then(r => r.json()).then(data => {
        const history = data.history || [];
        const container = document.getElementById("history-container");

        if (!history.length) {
          container.innerHTML = `<div class="empty-state">
            <div class="icon">🗂</div>
            <p>No history yet. When you generate a new schedule over an existing one, the old one gets archived here.</p>
          </div>`;
          return;
        }

        container.innerHTML = history.map(h => {
          const byDay = {};
          DAYS.forEach(d => byDay[d] = []);
          h.shifts.forEach(s => { if (byDay[s.day]) byDay[s.day].push(s); });

          let rows = "";
          for (const day of DAYS) {
            if (!byDay[day].length) continue;
            rows += `<tr class="day-section"><td colspan="4">${day}</td></tr>`;
            byDay[day].forEach(s => {
              rows += `<tr>
                <td>${s.worker ? `<strong>${esc(s.worker)}</strong>` : '<em style="color:#f87171">Unassigned</em>'}</td>
                <td>${esc(s.start_time)}</td>
                <td>${esc(s.end_time)}</td>
                <td>${s.role ? `<span class="role-chip">${esc(s.role)}</span>` : '—'}</td>
              </tr>`;
            });
          }

          return `<div class="history-item">
            <div class="history-header" onclick="toggle(${h.id})">
              <div>
                <div class="history-label">${esc(h.label)}</div>
                <div class="history-meta">Archived ${formatDate(h.created_at)} · ${h.shifts.length} shifts</div>
              </div>
              <span class="history-chevron" id="chev-${h.id}">›</span>
            </div>
            <div class="history-body" id="body-${h.id}">
              <table>
                <thead><tr><th>Worker</th><th>Start</th><th>End</th><th>Role</th></tr></thead>
                <tbody>${rows}</tbody>
              </table>
            </div>
          </div>`;
        }).join("");
      });
  </script>
</body>
</html>
