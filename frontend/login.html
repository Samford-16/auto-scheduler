<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In — A-Schedule</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-body">
  <div class="auth-card">
    <div class="auth-logo">A-Schedule</div>
    <p class="auth-subtitle">Sign in to your account</p>

    <div class="error-msg" id="error"></div>

    <div class="form-group">
      <label>Email</label>
      <input type="email" id="email" placeholder="you@company.com" autofocus>
    </div>
    <div class="form-group" style="margin-bottom:1.5rem">
      <label>Password</label>
      <input type="password" id="password" placeholder="••••••••" onkeydown="if(event.key==='Enter') login()">
    </div>

    <button class="btn btn-primary btn-full" onclick="login()">Sign In</button>
    <p class="footer-link">No account? <a href="signup.html">Create one free</a></p>
  </div>

  <script>
    const API = "http://34.28.196.192:5000";
    const t = localStorage.getItem("theme") || "dark";
    const a = localStorage.getItem("accent") || "emerald";
    document.body.classList.add(`theme-${t}`, `accent-${a}`);
    if (localStorage.getItem("token")) window.location.href = "dashboard.html";

    function login() {
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;
      const err = document.getElementById("error");
      err.style.display = "none";
      if (!email || !password) { err.textContent = "Please fill in all fields."; err.style.display = "block"; return; }
      fetch(`${API}/login`, {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email, password })
      }).then(r => r.json()).then(data => {
        if (data.status === "success") {
          localStorage.setItem("token", data.token);
          localStorage.setItem("company", JSON.stringify(data.company));
          window.location.href = "dashboard.html";
        } else { err.textContent = data.message || "Login failed."; err.style.display = "block"; }
      }).catch(() => { err.textContent = "Could not connect to server."; err.style.display = "block"; });
    }
  </script>
</body>
</html>
